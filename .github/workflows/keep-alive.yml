# BandMuft keep-alive — Render free tier so jata hai (spin down) jab traffic na ho.
# Ye workflow har ~10 minute mein health endpoint ko ping karta hai taake backend jaagta rahe.
# Bilkul free hai (public repo par GitHub Actions free hota hai).
# Note: GitHub 60 din repo inactivity ke baad scheduled workflows band kar sakta hai —
# koi bhi chhota commit ho jaye to dobara chal parta hai. Zaroorat paray to Actions tab se
# "Run workflow" bhi kar sakte ho.
name: keep-alive

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping BandMuft API health endpoint
        run: |
          curl -fsS --max-time 60 https://bandmuft.onrender.com/api/v1/health || true
